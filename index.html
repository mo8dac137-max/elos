<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELOS</title>
    <meta name="description" content="ELOS: evidence-driven English learning (early build)" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ELOS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta property="og:title" content="ELOS" />
    <meta property="og:description" content="ELOS: evidence-driven English learning (early build)" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #050505;
        color: #d8d8d8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        padding: 16px;
        min-height: 100vh;
      }
      .container {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #ffffff;
      }
      .unit-label {
        font-size: 16px;
        color: #999999;
      }
      .card {
        background: #0d0d0d;
        border: 1px solid #222222;
        padding: 16px;
        border-radius: 0;
      }
      .status-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
      }
      .notice-line {
        color: #7aa2ff;
        font-weight: 600;
      }
      .exercise-card {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .prompt-text {
        font-size: 18px;
        color: #ffffff;
        font-weight: 500;
      }
      .interaction-area {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .options-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .recall-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .btn {
        background: #141414;
        color: #d8d8d8;
        border: 1px solid #2a2a2a;
        min-height: 48px;
        font-size: 16px;
        font-family: system-ui, sans-serif;
        font-weight: 500;
        padding: 12px 16px;
        cursor: pointer;
        text-align: center;
        border-radius: 0;
        width: 100%;
      }
      .btn:hover {
        background: #1f1f1f;
        border-color: #3d3d3d;
      }
      .btn:focus-visible {
        outline: 2px solid #7aa2ff;
        outline-offset: 2px;
      }
      .btn-primary {
        background: #1c2b42;
        border-color: #335588;
        color: #ffffff;
      }
      .text-input {
        background: #141414;
        color: #d8d8d8;
        border: 1px solid #2a2a2a;
        min-height: 48px;
        font-size: 16px;
        font-family: system-ui, sans-serif;
        padding: 12px 16px;
        border-radius: 0;
        width: 100%;
      }
      .text-input:focus-visible {
        outline: 2px solid #7aa2ff;
        outline-offset: 2px;
      }
      .feedback-correct {
        color: #55dd77;
        font-size: 18px;
        font-weight: 600;
      }
      .feedback-incorrect {
        color: #ff6b6b;
        font-size: 18px;
        font-weight: 600;
      }
      .answer-info {
        font-size: 16px;
        color: #d8d8d8;
      }
      .backup-btn {
        margin-top: 8px;
      }
      .error-area {
        display: none;
        background: #250909;
        border: 1px solid #882222;
        color: #ff9999;
        padding: 12px;
        font-size: 16px;
      }
      .error-text {
        color: #ff6b6b;
        font-size: 18px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dist/ui/main.js"></script>
  </body>
</html>
