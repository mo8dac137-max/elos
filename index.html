<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELOS</title>
    <meta name="description" content="ELOS: evidence-driven English learning (early build)" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ELOS" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <meta property="og:title" content="ELOS" />
    <meta property="og:description" content="ELOS: evidence-driven English learning (early build)" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #050505;
        color: #d8d8d8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        padding: 16px;
        min-height: 100vh;
      }
      .container {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #ffffff;
      }
      .unit-label {
        font-size: 16px;
        color: #999999;
      }
      .card {
        background: #0d0d0d;
        border: 1px solid #222222;
        padding: 16px;
        border-radius: 0;
      }
      .status-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
      }
      .notice-line {
        color: #7aa2ff;
        font-weight: 600;
      }
      .exercise-card {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .prompt-text {
        font-size: 18px;
        color: #ffffff;
        font-weight: 500;
      }
      .interaction-area {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .options-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .recall-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .btn {
        background: #141414;
        color: #d8d8d8;
        border: 1px solid #2a2a2a;
        min-height: 48px;
        font-size: 16px;
        font-family: system-ui, sans-serif;
        font-weight: 500;
        padding: 12px 16px;
        cursor: pointer;
        text-align: center;
        border-radius: 0;
        width: 100%;
      }
      .btn:hover {
        background: #1f1f1f;
        border-color: #3d3d3d;
      }
      .btn:focus-visible {
        outline: 2px solid #7aa2ff;
        outline-offset: 2px;
      }
      .btn-primary {
        background: #1c2b42;
        border-color: #335588;
        color: #ffffff;
      }
      .text-input {
        background: #141414;
        color: #d8d8d8;
        border: 1px solid #2a2a2a;
        min-height: 48px;
        font-size: 16px;
        font-family: system-ui, sans-serif;
        padding: 12px 16px;
        border-radius: 0;
        width: 100%;
      }
      .text-input:focus-visible {
        outline: 2px solid #7aa2ff;
        outline-offset: 2px;
      }
      .feedback-correct {
        color: #55dd77;
        font-size: 18px;
        font-weight: 600;
      }
      .feedback-incorrect {
        color: #ff6b6b;
        font-size: 18px;
        font-weight: 600;
      }
      .answer-info {
        font-size: 16px;
        color: #d8d8d8;
      }
      .backup-btn {
        margin-top: 8px;
      }
      .error-area {
        display: none;
        background: #250909;
        border: 1px solid #882222;
        color: #ff9999;
        padding: 12px;
        font-size: 16px;
      }
      .error-text {
        color: #ff6b6b;
        font-size: 18px;
        font-weight: 600;
      }
      .plan-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .plan-line {
        color: #999999;
      }
      .size-row {
        display: flex;
        gap: 8px;
      }
      .size-btn {
        flex: 1;
      }
      .size-btn.selected {
        background: #1c2b42;
        border-color: #335588;
        color: #ffffff;
      }
      .session-progress {
        color: #999999;
        font-size: 16px;
      }
      .section-label {
        color: #999999;
        font-size: 14px;
        margin-top: 10px;
      }
      .rtl-block {
        direction: rtl;
        text-align: right;
        margin-top: 4px;
        line-height: 1.8;
      }
      .example-list {
        margin: 4px 0 0 18px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .unit-title {
        font-size: 18px;
        color: #ffffff;
        font-weight: 600;
      }
      .summary-en {
        margin-top: 4px;
      }
      .band-header {
        color: #7aa2ff;
        font-weight: 600;
        margin-top: 8px;
      }
      .unit-card-btn {
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .unit-card-btn:hover {
        border-color: #3d3d3d;
      }
      .unit-card-btn:focus-visible {
        outline: 2px solid #7aa2ff;
        outline-offset: 2px;
      }
      .due-line {
        color: #999999;
        font-size: 16px;
      }
      .totals-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .summary-rows-card {
        display: flex;
        flex-direction: column;
      }
      .summary-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 0;
        border-bottom: 1px solid #1a1a1a;
      }
      .summary-row:last-child {
        border-bottom: none;
      }
      .summary-row-title {
        color: #ffffff;
        font-weight: 500;
      }
      .summary-row-state,
      .summary-row-due {
        color: #999999;
        font-size: 16px;
      }
      .reader-para {
        font-size: 17px;
        line-height: 2.1;
        color: #d8d8d8;
        margin-top: 10px;
      }
      .reader-word {
        background: none;
        border: none;
        padding: 0 1px;
        color: inherit;
        font: inherit;
        line-height: inherit;
        cursor: pointer;
        border-bottom: 2px solid #333333;
      }
      .reader-word:focus-visible {
        outline: 2px solid #7aa2ff;
        outline-offset: 1px;
      }
      .reader-word.reader-known {
        color: #55dd77;
        border-bottom-color: #2c5c38;
      }
      .reader-word.reader-learning {
        color: #e8c46b;
        border-bottom-color: #6b5a2c;
      }
      .reader-word.reader-new {
        color: #7aa2ff;
        border-bottom-color: #2c3d5c;
      }
      .reader-word.reader-outside {
        color: #d8d8d8;
        border-bottom-color: #333333;
      }
      .reader-summary {
        color: #999999;
        font-size: 15px;
        margin-top: 6px;
      }
      .reader-tools {
        margin-top: 12px;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-size: 14px;
        color: #999999;
      }
      .legend-dot {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex: none;
      }
      .dot-known { background: #55dd77; }
      .dot-learning { background: #e8c46b; }
      .dot-new { background: #7aa2ff; }
      .word-popup {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./dist/ui/main.js"></script>
  </body>
</html>
